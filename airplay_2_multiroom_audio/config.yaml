name: Airplay2 Multiroom Audio
version: "1.04"
slug: airplay_2_multiroom_audio
description: Create AirPlay 2 receivers from local audio devices. Configure the advertised AirPlay receiver name with airplay_name, or use auto to retain each zone's current name.
arch:
  - amd64
  - aarch64
map:
  - addon_config:rw
  - media:rw
host_network: true
audio: true
init: false
startup: services
boot: auto
backup: hot
stage: experimental
options:
  airplay_interface: auto
  airplay_name: auto
schema:
  airplay_interface: str
  airplay_name: str
