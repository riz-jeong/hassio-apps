configuration:
  airplay_name:
    name: AirPlay receiver name
    description: >-
      Name advertised in Apple's AirPlay picker. Leave as auto to keep each
      receiver's current name, or enter a name up to 50 characters and 63 UTF-8
      bytes. Include {name} to keep each zone's current name in a custom template.
  airplay_interface:
    name: AirPlay network interface
    description: >-
      Interface used for AirPlay and mDNS discovery. Leave as auto to use the
      interface with the best eligible default route, or enter an interface
      name such as eth0. The interface must be up and have a LAN address.
