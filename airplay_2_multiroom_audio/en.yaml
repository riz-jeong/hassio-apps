configuration:
  airplay_name:
    name: AirPlay receiver name
    description: >-
      Name advertised in Apple's AirPlay picker. Leave as auto to keep each
      receiver's current name, or enter a name up to 50 characters and 63 UTF-8
      bytes. Include {name} to keep each zone's current name in a custom template.
      Default: auto.
  airplay_interface:
    name: AirPlay network interface
    description: >-
      Interface used for AirPlay and mDNS discovery. Leave as auto to use the
      interface with the best eligible default route, or enter an interface
      name such as eth0. The interface must be up and have a LAN address.
      Default: auto.
  airplay_decoded_buffer_seconds:
    name: AirPlay decoded audio buffer (seconds)
    description: >-
      Buffer capacity for AirPlay 2 buffered audio streams. Defaults to 3
      seconds as a balance of burst tolerance and buffering. Enter a value from 1 to 10;
      larger values can use more memory. The PulseAudio backend buffer defaults
      to 0.35 seconds and has a separate option. Output uses the connected sink's
      current sample rate by default, falling back to automatic selection if unavailable.
      Existing per-zone custom settings take precedence. Default: 3 seconds.
  airplay_backend_buffer_seconds:
    name: PulseAudio output buffer (seconds)
    description: >-
      Shairport Sync PulseAudio backend buffer for sink-backed AirPlay zones.
      Smaller values reduce response latency but may crackle if the host or
      audio device cannot keep up; larger values tolerate more scheduling
      jitter at the cost of latency. Choices range from 0.15 to 1.00 seconds.
      Default: 0.35 seconds.
  airplay_output_rate:
    name: AirPlay output sample rate
    description: >-
      Device keeps the current behavior and uses each selected PulseAudio
      sink's detected sample rate (falling back to Shairport Sync automatic
      selection if unavailable). Auto lets Shairport Sync adapt to the input.
      Other choices force a rate and may cause PulseAudio resampling. Default: device.
  airplay_interpolation:
    name: AirPlay rate interpolation
    description: >-
      Controls how Shairport Sync adjusts frames to maintain synchronization.
      Auto selects a method based on processor capability; vernier uses less
      processing, while soxr can use more CPU. Applies to sink-backed zones.
      Default: auto.
  cast_backend_buffer_seconds:
    name: Cast output backend buffer (seconds)
    description: >-
      Buffer for Shairport Sync's pipe output to Cast relays. Smaller values
      reduce responsiveness delay but can underrun; larger values improve
      tolerance at the cost of latency. Default: 0.10 seconds.
  cast_decoded_buffer_seconds:
    name: Cast decoded audio buffer (seconds)
    description: >-
      Capacity of Shairport Sync's decoded audio buffer for Cast relays.
      Larger values can absorb bursts but increase memory use. Default: 0.35 seconds.
  cast_output_rate:
    name: Cast relay sample rate
    description: >-
      PCM sample rate used between Shairport Sync, FFmpeg, and Cast devices.
      48000 Hz is the current default; 44100 Hz is provided for compatibility
      experiments. This must stay fixed because the raw PCM pipe carries no
      sample-rate metadata, so automatic per-track rate changes cannot be
      relayed safely. Restart the add-on after changing this option. Default: 48000 Hz.
  log_level:
    name: Shairport Sync log level
    description: >-
      Verbosity for sink-backed and Cast-backed Shairport Sync receivers. v is
      brief, vv is normal detail, and vvv is most detailed and grows logs
      fastest. Restart the add-on after changing it. Default: vv.

  airplay_lossless_mode:
    name: AirPlay lossless audio
    description: >-
      Keep AirPlay lossless audio enabled, or turn it off to
      avoid audible glitches some senders can produce while changing between
      lossy and lossless streams. Restart the add-on after changing this option.
      Default: on.
  airplay_eq_enabled:
    name: Enable 5-band Parametric EQ
    description: >-
      Apply the five configurable peaking filters below to every AirPlay zone,
      including Cast relays. Disabled by default so audio remains unchanged.
      Shairport Sync's convolution DSP supports all fixed output rates exposed
      by this add-on (44100–192000 Hz). Auto mode generates filters for standard
      44100 and 48000 Hz AirPlay streams. A sink reporting an unsupported rate
      will not start while EQ is enabled. EQ changes tone and room
      response; it does not repair clipping, dropouts, or electrical noise.
      Restart the add-on after changing EQ settings. Default: off.
  airplay_eq_band_1_frequency:
    name: Parametric EQ band 1 frequency (Hz)
    description: "Center frequency, 20–20000 Hz. Default: 80 Hz."
  airplay_eq_band_1_gain_db:
    name: Parametric EQ band 1 gain (dB)
    description: "Cut or boost from -12 to +12 dB. Default: 0 dB (flat)."
  airplay_eq_band_1_q:
    name: Parametric EQ band 1 Q
    description: "Bandwidth control from 0.1 (wide) to 5.0 (narrow). Default: 1.0."
  airplay_eq_band_2_frequency:
    name: Parametric EQ band 2 frequency (Hz)
    description: "Center frequency, 20–20000 Hz. Default: 250 Hz."
  airplay_eq_band_2_gain_db:
    name: Parametric EQ band 2 gain (dB)
    description: "Cut or boost from -12 to +12 dB. Default: 0 dB (flat)."
  airplay_eq_band_2_q:
    name: Parametric EQ band 2 Q
    description: "Bandwidth control from 0.1 (wide) to 5.0 (narrow). Default: 1.0."
  airplay_eq_band_3_frequency:
    name: Parametric EQ band 3 frequency (Hz)
    description: "Center frequency, 20–20000 Hz. Default: 1000 Hz."
  airplay_eq_band_3_gain_db:
    name: Parametric EQ band 3 gain (dB)
    description: "Cut or boost from -12 to +12 dB. Default: 0 dB (flat)."
  airplay_eq_band_3_q:
    name: Parametric EQ band 3 Q
    description: "Bandwidth control from 0.1 (wide) to 5.0 (narrow). Default: 1.0."
  airplay_eq_band_4_frequency:
    name: Parametric EQ band 4 frequency (Hz)
    description: "Center frequency, 20–20000 Hz. Default: 4000 Hz."
  airplay_eq_band_4_gain_db:
    name: Parametric EQ band 4 gain (dB)
    description: "Cut or boost from -12 to +12 dB. Default: 0 dB (flat)."
  airplay_eq_band_4_q:
    name: Parametric EQ band 4 Q
    description: "Bandwidth control from 0.1 (wide) to 5.0 (narrow). Default: 1.0."
  airplay_eq_band_5_frequency:
    name: Parametric EQ band 5 frequency (Hz)
    description: "Center frequency, 20–20000 Hz. Default: 12000 Hz."
  airplay_eq_band_5_gain_db:
    name: Parametric EQ band 5 gain (dB)
    description: "Cut or boost from -12 to +12 dB. Default: 0 dB (flat)."
  airplay_eq_band_5_q:
    name: Parametric EQ band 5 Q
    description: "Bandwidth control from 0.1 (wide) to 5.0 (narrow). Default: 1.0."
